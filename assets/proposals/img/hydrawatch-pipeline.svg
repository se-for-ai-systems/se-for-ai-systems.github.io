<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" role="img" aria-label="HydraWatch data pipeline: streams on site, history and monitoring in the cloud, alerts trigger retraining" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="450" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1a1a2e">Streams run on site; only features and predictions reach the cloud, where drift triggers retraining</text>

  <!-- bands -->
  <rect x="12" y="44" width="956" height="176" rx="10" fill="#fef9c3" fill-opacity="0.45" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text x="24" y="62" font-size="11" font-weight="600" fill="#92400e">Customer site: streaming, raw data stays here</text>
  <rect x="12" y="236" width="956" height="200" rx="10" fill="#eff6ff" fill-opacity="0.6" stroke="#93c5fd" stroke-dasharray="6 4"/>
  <text x="24" y="254" font-size="11" font-weight="600" fill="#1e40af">HydraWatch cloud</text>

  <!-- processing boxes (rect) and topics (pill) -->
  <g stroke="#64748b" stroke-width="1" fill="#ffffff">
    <rect x="24" y="86" width="112" height="48" rx="6"/>
    <rect x="284" y="86" width="112" height="48" rx="6"/>
    <rect x="544" y="86" width="112" height="48" rx="6"/>
    <rect x="804" y="86" width="152" height="48" rx="6"/>
    <rect x="154" y="160" width="112" height="48" rx="6"/>
    <rect x="414" y="270" width="372" height="48" rx="6"/>
    <rect x="804" y="270" width="152" height="48" rx="6"/>
    <rect x="154" y="360" width="632" height="56" rx="6"/>
  </g>
  <g stroke="#0d9488" stroke-width="1.25" fill="#f0fdfa">
    <rect x="154" y="86" width="112" height="48" rx="24"/>
    <rect x="414" y="86" width="112" height="48" rx="24"/>
    <rect x="674" y="86" width="112" height="48" rx="24"/>
  </g>

  <g text-anchor="middle">
    <g font-size="12.5" font-weight="600" fill="#1a1a2e">
      <text x="80" y="106">Sensors</text>
      <text x="210" y="106">sensor-raw</text>
      <text x="340" y="106">Feature job</text>
      <text x="470" y="106">features</text>
      <text x="600" y="106">Inference</text>
      <text x="730" y="106">predictions</text>
      <text x="880" y="106">Local alarms</text>
      <text x="210" y="180">Data quality</text>
      <text x="600" y="290">Feature and prediction history</text>
      <text x="880" y="290">Retraining</text>
      <text x="470" y="381">Monitoring: Prometheus and Grafana</text>
    </g>
    <g font-size="11" fill="#475569">
      <text x="80" y="123">17 signals, 1-100 Hz</text>
      <text x="210" y="123">topic</text>
      <text x="340" y="123">per 60 s cycle</text>
      <text x="470" y="123">topic</text>
      <text x="600" y="123">4 components</text>
      <text x="730" y="123">topic</text>
      <text x="880" y="123">technician on site</text>
      <text x="210" y="197">schema, ranges</text>
      <text x="600" y="307">Parquet files in object storage</text>
      <text x="880" y="307">MLflow run, new version</text>
      <text x="470" y="400">data quality, drift (live vs. training features), latency, SLOs</text>
    </g>
  </g>

  <!-- streaming flow -->
  <g fill="none" stroke="#475569" stroke-width="1.5">
    <path d="M136 110 H152" marker-end="url(#arrow)"/>
    <path d="M266 110 H282" marker-end="url(#arrow)"/>
    <path d="M396 110 H412" marker-end="url(#arrow)"/>
    <path d="M526 110 H542" marker-end="url(#arrow)"/>
    <path d="M656 110 H672" marker-end="url(#arrow)"/>
    <path d="M786 110 H802" marker-end="url(#arrow)"/>
    <path d="M210 134 V158" marker-end="url(#arrow)"/>
    <!-- across the boundary -->
    <path d="M470 134 V268" marker-end="url(#arrow)"/>
    <path d="M730 134 V268" marker-end="url(#arrow)"/>
    <path d="M210 208 V358" marker-end="url(#arrow)"/>
    <path d="M600 318 V358" marker-end="url(#arrow)"/>
    <path d="M786 294 H802" marker-end="url(#arrow)"/>
    <path d="M786 388 H880 V320" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10.5" fill="#475569">
    <text x="216" y="300">metrics only</text>
    <text x="606" y="342">weekly windows</text>
    <text x="886" y="350">alert: retrain</text>
    <text x="886" y="363">or roll back</text>
  </g>
</svg>
