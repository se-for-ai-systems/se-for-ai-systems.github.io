<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" role="img" aria-label="Portfolio timeline: each portfolio starts at its seminar and is due before the next one" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="820" height="410" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1a1a2e">Each portfolio starts at its seminar and is due before the next one</text>

  <!-- week grid (x = 190 + 12.826 per day from Mon 25 Jan 2027) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="190" y1="70" x2="190" y2="345"/>
    <line x1="279.8" y1="70" x2="279.8" y2="345"/>
    <line x1="369.6" y1="70" x2="369.6" y2="345"/>
    <line x1="459.3" y1="70" x2="459.3" y2="345"/>
    <line x1="549.1" y1="70" x2="549.1" y2="345"/>
    <line x1="638.9" y1="70" x2="638.9" y2="345"/>
    <line x1="728.7" y1="70" x2="728.7" y2="345"/>
    <line x1="780" y1="70" x2="780" y2="345"/>
  </g>
  <g font-size="12" font-weight="600" fill="#475569" text-anchor="middle">
    <text x="234.9" y="62">Week 1</text>
    <text x="324.7" y="62">Week 2</text>
    <text x="414.5" y="62">Week 3</text>
    <text x="504.2" y="62">Week 4</text>
    <text x="594" y="62">Week 5</text>
    <text x="683.8" y="62">Week 6</text>
    <text x="754.3" y="62">Week 7</text>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="190" y="362">25 Jan</text>
    <text x="279.8" y="362">1 Feb</text>
    <text x="369.6" y="362">8 Feb</text>
    <text x="459.3" y="362">15 Feb</text>
    <text x="549.1" y="362">22 Feb</text>
    <text x="638.9" y="362">1 Mar</text>
    <text x="728.7" y="362">8 Mar</text>
  </g>

  <!-- row labels -->
  <g font-size="12.5" fill="#1a1a2e">
    <text x="24" y="104" font-weight="600">Seminar days</text>
    <text x="24" y="164" font-weight="600" fill="#2563eb">P1 Software architecture</text>
    <text x="24" y="219" font-weight="600" fill="#0d9488">P2 Cloud continuum</text>
    <text x="24" y="274" font-weight="600" fill="#9333ea">P3 Big data</text>
    <text x="24" y="329" font-weight="600">Exam</text>
  </g>

  <!-- seminars -->
  <g fill="#f59e0b" stroke="#b45309" stroke-width="1">
    <path d="M241.3 91 l9 9 l-9 9 l-9 -9 z"/>
    <path d="M420.9 91 l9 9 l-9 9 l-9 -9 z"/>
    <path d="M600.4 91 l9 9 l-9 9 l-9 -9 z"/>
  </g>
  <g font-size="11" fill="#92400e" text-anchor="middle">
    <text x="241.3" y="126">S1 Architecture</text>
    <text x="420.9" y="126">S2 Cloud continuum</text>
    <text x="600.4" y="126">S3 Big data</text>
  </g>

  <!-- P1: 29 Jan to 8 Feb, review 10 Feb -->
  <rect x="241.3" y="151" width="128.3" height="18" rx="4" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb"/>
  <line x1="369.6" y1="160" x2="390.2" y2="160" stroke="#2563eb" stroke-dasharray="3 3"/>
  <circle cx="395.2" cy="160" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="241.3" y="186" font-size="10.5" fill="#475569">29 Jan, due Mon 8 Feb, review Wed 10 Feb</text>

  <!-- P2: 12 Feb to 22 Feb, review 24 Feb -->
  <rect x="420.9" y="206" width="128.2" height="18" rx="4" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488"/>
  <line x1="549.1" y1="215" x2="569.8" y2="215" stroke="#0d9488" stroke-dasharray="3 3"/>
  <circle cx="574.8" cy="215" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="420.9" y="241" font-size="10.5" fill="#475569">12 Feb, due Mon 22 Feb, review Wed 24 Feb</text>

  <!-- P3: 26 Feb to 3 Mar, review 5 Mar -->
  <rect x="600.4" y="261" width="64.2" height="18" rx="4" fill="#9333ea" fill-opacity="0.18" stroke="#9333ea"/>
  <line x1="664.6" y1="270" x2="685.2" y2="270" stroke="#9333ea" stroke-dasharray="3 3"/>
  <circle cx="690.2" cy="270" r="5" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="796" y="296" font-size="10.5" fill="#475569" text-anchor="end">26 Feb, due Wed 3 Mar, review Fri 5 Mar</text>

  <!-- exam: report 8 Mar, oral exam 12 Mar -->
  <path d="M728.7 316 l9 9 l-9 9 l-9 -9 z" fill="#475569"/>
  <path d="M780 316 l9 9 l-9 9 l-9 -9 z" fill="#475569"/>
  <text x="712" y="329" font-size="10.5" fill="#475569" text-anchor="end">final report Mon 8 Mar, oral exam Fri 12 Mar</text>

  <!-- legend -->
  <g font-size="11" fill="#475569">
    <path d="M30 384 l7 7 l-7 7 l-7 -7 z" fill="#f59e0b" stroke="#b45309"/>
    <text x="44" y="395">seminar day</text>
    <rect x="140" y="384" width="28" height="14" rx="3" fill="#64748b" fill-opacity="0.18" stroke="#64748b"/>
    <text x="176" y="395">work period, ends at the due date</text>
    <circle cx="386" cy="391" r="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="398" y="395">peer review due</text>
  </g>
</svg>
