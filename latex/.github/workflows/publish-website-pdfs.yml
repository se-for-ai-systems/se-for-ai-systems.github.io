name: Publish Website PDFs

on:
  workflow_run:
    workflows: ["Build Documents"]
    # workflows: ["Publish"] # TODO:
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  REPO_PATH: "website"

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download PDFs artifact
        uses: actions/download-artifact@v8
        with:
          name: PDFs
          path: ${{ vars.MATERIALS_PATH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: se-for-ai-systems/se-for-ai-systems.github.io
          token: ${{ secrets.WEBSITE_PAT }}
          fetch-depth: 0
          path: ${{ env.REPO_PATH }}

      - name: Copy PDFs to website
        run: |
          # cp ${{ vars.MATERIALS_PATH}}/**/main.pdf ${{ env.REPO_PATH }}/${{ vars.MATERIALS_PATH}}
          cp -r ${{ vars.MATERIALS_PATH}} ${{ env.REPO_PATH }}/

      - name: Commit and push
        run: |
          cd ${{ env.REPO_PATH }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ vars.MATERIALS_PATH}}/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update course materials from release ${{ github.event.workflow_run.head_branch }}"
          git push
