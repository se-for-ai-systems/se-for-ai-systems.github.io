name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    container: ghcr.io/se-for-ai-systems/materials-texlive:latest
    permissions:
      contents: write  # required to upload release assets

    steps:
      - uses: actions/checkout@v6

      - name: Build all documents
        run: make

      - name: Collect PDFs
        shell: bash
        run: |
          mkdir -p dist
          find . \( -path './lectures/*/*/main.pdf' \
                 -o -path './assignments/*/*/main.pdf' \) \
          | while read f; do
            rel="${f#./}"
            name="${rel%/main.pdf}"
            name="${name//\//-}"
            cp "$f" "dist/${name}.pdf"
          done
          cp assignments/portfolio/*/*.zip dist/

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PDFs
          path: |
            dist/*.pdf
            dist/*.zip
