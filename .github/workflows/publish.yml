name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload release assets

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-publishers \
            latexmk

      - name: Build all documents
        run: make

      - name: Collect PDFs
        run: |
          mkdir -p dist
          find . \( -path './lectures/*/*/main.pdf' \
                 -o -path './assignments/*/*/main.pdf' \) \
          | while read f; do
            rel="${f#./}"
            name="${rel%/main.pdf}"
            name="${name//\//-}"
            cp "$f" "dist/${name}.pdf"
          done

      - name: Upload PDFs to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
