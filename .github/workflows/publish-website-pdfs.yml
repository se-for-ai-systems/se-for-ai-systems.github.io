name: Publish Website PDFs

on:
  workflow_run:
    workflows: ["Build Documents"]
    # workflows: ["Publish"] # TODO:
    types: [completed]


env:
  MATERIALS_PATH: "assets"

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download PDFs artifact
        uses: actions/download-artifact@v8
        with:
          name: PDFs
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          repository: se-for-ai-systems/se-for-ai-systems.github.io.git
          token: ${{ secrets.WEBSITE_PAT }}
          path: website

      - name: Copy PDFs to website
        run: |
          # mkdir -p ${{ env.MATERIALS_PATH}}
          cp dist/*.pdf ${{ env.MATERIALS_PATH}}

      - name: Commit and push
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MATERIALS_PATH}}/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update course materials from release ${{ github.event.workflow_run.head_branch }}"
          git push
