name: Build Documents

on:
  push:
    paths:
        - "lectures/**"
        - "assignments/**"
        - "shared/**"
        - "Makefile"
        - ".github/workflows/build.yml"
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/se-for-ai-systems/materials-texlive:latest

    steps:
      - uses: actions/checkout@v6

      - name: Build all documents
        run: make

      - name: Collect PDFs and template zips
        shell: bash
        run: |
          find . \( -path './lectures/**/main.pdf' \
                -o -path './assignments/**/main.pdf' \
                -o -path './assignments/**/*.zip' \) \
          | while read f; do
          rel="${f#./}"
          mkdir -p "${{ vars.MATERIALS_PATH}}/$(dirname "$rel")"
          cp "$f" "${{ vars.MATERIALS_PATH}}/${rel}"
          done


      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PDFs
          path: |
            ${{ vars.MATERIALS_PATH}}/**/main.pdf
            ${{ vars.MATERIALS_PATH}}/**/*.zip
          retention-days: 30
