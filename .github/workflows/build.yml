name: Build Documents

on:
  push:
    paths:
        - "lectures/*"
        - "assignments/*"
        - ".github/workflows/build.yml"
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/se-for-ai-systems/materials-texlive:latest

    steps:
      - uses: actions/checkout@v6

      - name: Build all documents
        run: make

      - name: Collect PDFs
        shell: bash
        run: |
          find . \( -path './lectures/**/main.pdf' \
                -o -path './assignments/**/main.pdf' \) \
          | while read f; do
          rel="${f#./}"
          filen_path="${{ vars.MATERIALS_PATH}}/${rel%/main.pdf}"
          mkdir -p "$filen_path"
          filen_name="${{ vars.MATERIALS_PATH}}/${rel}"
          cp "$f" "$filen_name"
          done
        

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PDFs
          path: ${{ vars.MATERIALS_PATH}}/**/main.pdf
          retention-days: 30
