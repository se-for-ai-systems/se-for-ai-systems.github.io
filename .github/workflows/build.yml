name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-publishers \
            latexmk

      - name: Build all documents
        run: make

      - name: Collect PDFs
        run: |
          mkdir -p dist
          find . \( -path './lectures/*/*/main.pdf' \
                 -o -path './assignments/*/*/main.pdf' \) \
          | while read f; do
            echo "Processing $f"
            rel="${f#./}"
            name="${rel%/main.pdf}"
            name="${name//\//-}"
            cp "$f" "dist/${name}.pdf"
          done

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf
          retention-days: 30
