name: Build Documents

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/se-for-ai-systems/materials-texlive:latest

    steps:
      - uses: actions/checkout@v6

      - name: Build all documents
        run: make

      - name: Collect PDFs
        shell: bash
        run: |
          mkdir -p dist
          find . \( -path './lectures/*/*/main.pdf' \
                 -o -path './assignments/*/*/main.pdf' \) \
          | while read f; do
          rel="${f#./}"
          name="${rel%/main.pdf}"
          name="${name//\//-}"
          echo "$f -> ${name}"
            cp "$f" "dist/${name}.pdf"
          done

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PDFs
          path: dist/*.pdf
          retention-days: 30
