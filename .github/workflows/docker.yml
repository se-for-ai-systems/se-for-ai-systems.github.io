name: Docker

on:
  push:
    branches: [ "main" ]
    paths:
      - latex/Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/se-for-ai-systems/course-texlive

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: latex
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
